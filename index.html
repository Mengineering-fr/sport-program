<title>Prog Nico</title>
<style>
:root{
  color-scheme: light;
  --bg:#F2F3EF; --surface:#FFFFFF; --sunk:#E7E9E3; --ink:#1A1F26; --muted:#5E6670; --line:#D5D8D0;
  --a:#2456C8; --b:#E3A400; --c:#2E8B4A; --w:#D0303F; --t:#1A1F26;
  --on-b:#1A1F26; --ok:#2E8B4A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#14181E; --surface:#1D232B; --sunk:#262D36; --ink:#EEF0EC; --muted:#9AA3AD; --line:#323A44;
    --a:#4F7FE8; --b:#F2B705; --c:#3FAE62; --w:#E8495A; --t:#EEF0EC; --ok:#3FAE62;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#14181E; --surface:#1D232B; --sunk:#262D36; --ink:#EEF0EC; --muted:#9AA3AD; --line:#323A44;
  --a:#4F7FE8; --b:#F2B705; --c:#3FAE62; --w:#E8495A; --t:#EEF0EC; --ok:#3FAE62;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}

.app{max-width:560px;margin:0 auto;padding:0 18px 120px}
header.top{padding:18px 0 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
header.top h1{margin:0;font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-.02em}
header.top p{margin:4px 0 0;color:var(--muted);font-size:14px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--a);font-weight:600;font-size:17px;padding:14px 0 4px}

h2{font-size:22px;font-weight:750;letter-spacing:-.01em;margin:26px 0 10px}
h3{font-size:17px;font-weight:700;margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}

/* Week bar */
.weeks{display:flex;background:var(--sunk);border-radius:12px;padding:3px;margin:14px 0 4px}
.weeks button{flex:1;padding:9px 0;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted)}
.weeks button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Plates: the signature element */
.plates{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 6px}
.plate{aspect-ratio:1;border-radius:50%;background:var(--pc);color:#fff;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:inset 0 0 0 5px rgba(0,0,0,.14), inset 0 0 0 9px rgba(255,255,255,.10);transition:transform .15s}
.plate:active{transform:scale(.94)}
.plate::after{content:"";position:absolute;width:16%;height:16%;border-radius:50%;background:var(--bg);opacity:.9;top:42%}
.plate .l{font-size:26px;font-weight:850;line-height:1;margin-top:-34%}
.plate .s{position:absolute;bottom:13%;font-size:11px;font-weight:700;opacity:.9}
.plate.done{background:transparent;color:var(--pc);box-shadow:inset 0 0 0 4px var(--pc)}
.plate.done::after{content:"✓";display:flex;align-items:center;justify-content:center;background:none;opacity:1;font-weight:800;font-size:18px;top:auto;width:auto;height:auto;position:static;margin-top:6px}
.plate.done .l{margin-top:0}
.plate.done .s{display:none}
.p-A{--pc:var(--a)} .p-B{--pc:var(--b)} .p-C{--pc:var(--c)} .p-W{--pc:var(--w)}
.plate.p-B:not(.done){color:var(--on-b)}

.progress{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;margin:12px 0 4px}
.progress i{display:block;height:100%;background:var(--ok);border-radius:4px;transition:width .3s}

/* Lists */
.list{background:var(--surface);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.chev{color:var(--muted);font-size:20px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--pc);flex:none}

/* Exercise blocks */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;border-left:6px solid var(--pc,var(--line))}
.ex .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0 2px;font-size:14px;color:var(--muted)}
.ex .meta b{color:var(--ink);font-weight:650}
.weight{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:8px 0 0;font-variant-numeric:tabular-nums}
.weight small{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0}
.sets{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.set{width:48px;height:48px;border-radius:50%;border:2.5px solid var(--pc,var(--ink));font-weight:750;font-size:16px;
  display:flex;align-items:center;justify-content:center;color:var(--pc,var(--ink))}
.set.on{background:var(--pc,var(--ink));color:#fff}
.p-B .set.on{color:var(--on-b)}
.restline{display:flex;align-items:center;gap:10px;margin:4px 0;padding:10px 14px;border-radius:12px;background:var(--sunk);font-size:14px;color:var(--muted)}
.restline .grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:650;font-size:15px;background:var(--sunk);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px;border-radius:9px;background:var(--surface);border:1px solid var(--line)}
.btn.full{width:100%}
.btn.danger{color:var(--w)}

/* Test steps */
.step{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0}
.check{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:transparent;margin-top:1px}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.step .grow{flex:1}
.step .reps{font-weight:700}
details{margin-top:12px;font-size:14px}
details summary{color:var(--a);font-weight:600;cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
details p{margin:8px 0 0;color:var(--muted)}
.result{display:flex;gap:8px;align-items:center;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.result input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:17px;font-weight:650}
.note{background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted);margin:12px 0}

/* Records */
.rec{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.rec:first-child{border-top:0}
.rec label{flex:1;font-weight:600}
.rec input{width:96px;height:42px;text-align:right;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 10px;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.rec span{width:34px;color:var(--muted);font-size:14px}

/* AMRAP */
.big-clock{font-size:76px;font-weight:800;text-align:center;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:14px 0 4px;line-height:1}
.rounds{display:flex;align-items:center;justify-content:center;gap:20px;margin:18px 0}
.rounds .n{font-size:54px;font-weight:850;min-width:80px;text-align:center;font-variant-numeric:tabular-nums}
.circle-btn{width:64px;height:64px;border-radius:50%;font-size:30px;font-weight:700;background:var(--sunk)}
.circle-btn.plus{background:var(--w);color:#fff}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 88%,transparent);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex}
nav.tabs button{flex:1;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button[aria-current="page"]{color:var(--a)}

/* Rest timer sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.sheet .in{max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:22px 22px 0 0;
  padding:16px 20px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet .lbl{font-size:14px;opacity:.7;text-align:center}
.sheet .clock{font-size:64px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1.1}
.sheet .bar{height:6px;border-radius:3px;background:rgba(127,127,127,.35);overflow:hidden;margin:8px 0 14px}
.sheet .bar i{display:block;height:100%;background:var(--bg)}
.sheet .acts{display:flex;gap:10px}
.sheet .acts button{flex:1;min-height:46px;border-radius:12px;background:rgba(127,127,127,.25);font-weight:700}
.sheet.finished .in{background:var(--ok);color:#fff}
.sheet.finished .bar i{background:#fff}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-150%);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:40;transition:transform .25s}
.toast.show{transform:translate(-50%,0)}


/* Illustrations */
.exhead{display:flex;gap:12px;align-items:flex-start}
.exhead .grow{flex:1;min-width:0}
.fig{width:108px;height:96px;flex:none;border-radius:12px;background:var(--sunk);display:block}
.fig .b line{stroke:var(--ink);stroke-width:4.5;stroke-linecap:round}
.fig .h{fill:var(--ink)}
.fig .g{stroke:var(--line);stroke-width:2}
.fig .e{stroke:var(--muted);stroke-width:3.5;stroke-linecap:round}
.fig .e2{stroke:var(--muted);stroke-width:2.5;opacity:.7}
.fig .e3{fill:var(--muted);opacity:.7}
.fig .c{stroke:var(--muted);stroke-width:1.5}
.fig .p{fill:var(--pc,var(--a));opacity:.85}
.p-B .fig .p{fill:var(--b)}
.wodfigs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.wodfigs div{text-align:center;font-size:13px;color:var(--muted)}
.wodfigs .fig{width:100%;height:auto;aspect-ratio:120/106;margin-bottom:4px}

.hero{display:block;width:100%;height:auto;aspect-ratio:720/597;object-fit:cover;border-radius:18px;margin-top:14px;border:3px solid var(--ink)}
.coach-av{width:28px;height:28px;border-radius:50%;vertical-align:middle;margin-right:8px;object-fit:cover}
details summary{display:flex;align-items:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

  const J=chain(p); const an=[lerp(F.at[0][0],F.at[1][0],t),lerp(F.at[0][1],F.at[1][1],t)];
  const off=[an[0]-J[F.anchor][0],an[1]-J[F.anchor][1]];
  for(const k in J){J[k]=[J[k][0]+off[0],J[k][1]+off[1]];}
  const f=(n)=>n.toFixed(1); const ln=(a,b)=>`<line x1="${f(J[a][0])}" y1="${f(J[a][1])}" x2="${f(J[b][0])}" y2="${f(J[b][1])}"/>`;
  return `${F.eq(J)}<g class="b">${ln('ft','kn')}${ln('kn','hip')}${ln('hip','sh')}${ln('sh','el')}${ln('el','ha')}</g><circle cx="${f(J.hd[0])}" cy="${f(J.hd[1])}" r="${L.hr}" class="h"/>`;
}

const FIG_BY_NAME={'Squat':'squat','Soulevé de terre':'sdt','Traction':'traction','Dips':'dips','Tirage poulie haute':'haute','Tirage poulie horizontale':'horiz','Pompes':'pompes','Superman':'superman','Planche':'planche','Abdos':'abdos','Rameur':'rameur'};
const LIFT_FIG={traction:'traction',dips:'dips',squat:'squat',sdt:'sdt',haute:'haute',horiz:'horiz'};
function fig(key,label){ if(!key||!FIGS[key]) return '';
  return `<svg class="fig" data-fig="${key}" viewBox="0 -8 120 106" role="img" aria-label="Illustration : ${esc(label||key)}">${figSVG(key,0)}</svg>`; }
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function animateFigs(now){
  const els=document.querySelectorAll('svg.fig[data-fig]');
  if(els.length){
    const ph=(now%2400)/2400; let tri=ph<.5?ph*2:2-ph*2; // aller-retour
    tri=Math.min(1,Math.max(0,(tri-.12)/.76)); const t=reduceMotion?1:tri*tri*(3-2*tri);
    els.forEach(el=>{ const r=el.getBoundingClientRect(); if(r.bottom<0||r.top>innerHeight) return; el.innerHTML=figSVG(el.dataset.fig,t); });
  }
  if(!reduceMotion) requestAnimationFrame(animateFigs);
}

/* ---------- État ---------- */
const KEY = 'prognico-v1';
const fresh = ()=>({week:1, rm:{}, rmDate:{}, sets:{}, done:{}, tests:{}, wod:[]});
let S = fresh();
try{ const raw = localStorage.getItem(KEY); if(raw) S = Object.assign(fresh(), JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

let view = {tab:'cycle', sub:null};

/* ---------- Utilitaires ---------- */
const $ = (s)=>document.querySelector(s);
const esc = (t)=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (s)=>{ s=Math.max(0,Math.ceil(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const restTxt = (s)=> s>=60 ? (Math.floor(s/60)+' min'+(s%60?' '+(s%60):'')) : s+' s';
const half = (lift)=>{ const v=parseFloat(S.rm[lift]); if(!v) return null; return Math.round(v*0.5/2.5)*2.5; };
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),1800); }

let actx=null;
function unlockAudio(){ try{ if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)(); } if(actx.state==='suspended') actx.resume(); }catch(e){} }
function beep(n=3){
  try{ if(!actx) return;
    for(let i=0;i<n;i++){ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=i===n-1?1320:880;
      o.connect(g); g.connect(actx.destination); const t=actx.currentTime+i*0.28;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.35,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
      o.start(t); o.stop(t+0.24); }
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
}

/* ---------- Minuteur de récup ---------- */
const R = {end:0, total:0, int:null, label:''};
function startRest(sec,label){
  unlockAudio();
  R.total=sec; R.end=Date.now()+sec*1000; R.label=label||'Récupération';
  $('#sheet').classList.remove('finished'); $('#sheet').classList.add('open');
  clearInterval(R.int); R.int=setInterval(tickRest,250); tickRest();
}
function tickRest(){
  const left=(R.end-Date.now())/1000;
  $('#sheetLbl').textContent = left>0 ? R.label : 'C’est reparti !';
  $('#sheetClock').textContent = fmt(left);
  $('#sheetBar').style.width = Math.max(0,Math.min(100,left/R.total*100))+'%';
  if(left<=0 && !$('#sheet').classList.contains('finished')){
    $('#sheet').classList.add('finished'); beep(3);
    clearInterval(R.int); setTimeout(()=>{ if($('#sheet').classList.contains('finished')) stopRest(); },4000);
  }
}
function stopRest(){ clearInterval(R.int); $('#sheet').classList.remove('open','finished'); }

/* ---------- AMRAP ---------- */
const A = {dur:20*60, end:0, remain:20*60, running:false, rounds:0, int:null};
function amrapTick(){
  if(A.running){ A.remain=(A.end-Date.now())/1000;
    if(A.remain<=0){ A.remain=0; A.running=false; clearInterval(A.int); beep(4); toast('Temps écoulé !'); render(); return; }
  }
  const c=$('#amrapClock'); if(c) c.textContent=fmt(A.remain);
}

/* ---------- Rendu ---------- */
function weekBar(){
  return `<div class="weeks" role="group" aria-label="Semaine">${[1,2,3].map(w=>
    `<button data-act="week" data-w="${w}" aria-pressed="${S.week===w}">Semaine ${w}</button>`).join('')}</div>`;
}

function renderCycle(){
  const w=S.week, keys=['A','B','C','W'];
  const total=12, done=Object.keys(S.done).filter(k=>S.done[k]).length;
  const missing = ['squat','sdt','haute','horiz'].filter(l=>!S.rm[l]);
  return `
  <img class="hero" src="${HERO_IMG}" alt="Jim le coach">
  <header class="top"><div><h1>Cycle 1</h1><p>3 séances par semaine, environ 1 h · essai sur 3 semaines</p></div></header>
  ${weekBar()}
  <div class="plates">${keys.map(k=>{
    const d=S.done['w'+w+'-'+k];
    return `<button class="plate p-${k}${d?' done':''}" data-act="open" data-s="${k}" aria-label="${SESSIONS[k].title}${d?', faite':''}">
      <span class="l">${k==='W'?'WOD':k}</span><span class="s">${k==='W'?'20 min':'1 h'}</span></button>`;}).join('')}</div>
  <div class="progress" aria-hidden="true"><i style="width:${done/total*100}%"></i></div>
  <p class="small muted" style="margin:0">${done} séance${done>1?'s':''} sur ${total} sur le cycle</p>
  ${missing.length?`<div class="note">Les charges sont calculées à 50 % de ta 1RM. Il te manque encore : ${missing.map(l=>LIFTS.find(x=>x.id===l).name.toLowerCase()).join(', ')}. <button class="btn sm" data-tab="tests" style="margin-top:8px">Faire les tests 1RM</button></div>`:''}
  <h2>Séances</h2>
  <div class="list">${keys.map(k=>`
    <button class="row p-${k}" data-act="open" data-s="${k}"><span class="dot"></span>
      <span class="grow"><h3>${SESSIONS[k].title}</h3><span class="small muted">${k==='W'?'AMRAP 20 min':SESSIONS[k].main.map(e=>e.name).join(', ')}</span></span>
      ${S.done['w'+w+'-'+k]?'<span class="tag" style="color:var(--ok)">Faite</span>':''}<span class="chev">›</span></button>`).join('')}
  </div>`;
}

function setDots(key,n){
  const arr=S.sets[key]||[];
  let h='<div class="sets">';
  for(let i=0;i<n;i++) h+=`<button class="set${arr[i]?' on':''}" data-act="set" data-k="${key}" data-i="${i}" aria-label="Série ${i+1}${arr[i]?' faite':''}">${i+1}</button>`;
  return h+'</div>';
}

function renderSession(k){
  const w=S.week, base='w'+w+'-'+k, s=SESSIONS[k];
  if(k==='W') return renderWod();
  let h=`<button class="back" data-act="home">‹ Cycle 1</button>
  <header class="top"><div><h1>${s.title}</h1><p>Semaine ${w}</p></div></header>
  <div class="ex" style="--pc:var(--line)"><div class="exhead"><div class="grow"><h3>Échauffement</h3><div class="meta"><span>Rameur <b>5 min</b></span></div></div>${fig('rameur','Rameur')}</div></div>
  <h2>Warm up</h2>`;
  s.main.forEach((e,i)=>{
    let wt='';
    if(e.lift){ const v=half(e.lift);
      wt = v ? `<div class="weight">${v} kg <small>50 % de ${S.rm[e.lift]} kg${e.bar&&v>20?' · '+((v-20)/2)+' kg de chaque côté':''}</small></div>`
             : `<div class="weight" style="font-size:17px">50 % 1RM <small>· fais d’abord ton test</small></div>`;
    }
    if(e.ref && S.rm[e.ref]) wt=`<div class="small muted" style="margin-top:6px">Ton record : <b style="color:var(--ink)">${S.rm[e.ref]} reps</b></div>`;
    h+=`<div class="ex p-${k}"><div class="exhead"><div class="grow"><h3>${e.name}</h3>
      <div class="meta"><span><b>${e.sets}</b> séries</span><span><b>${e.reps}</b></span><span>Récup <b>${restTxt(e.rest)}</b></span></div>
      ${wt}</div>${fig(FIG_BY_NAME[e.name],e.name)}</div>${setDots(base+'-m'+i,e.sets)}</div>`;
    h+=`<div class="restline"><span class="grow">3 min de repos avant l’exercice suivant</span><button class="btn sm" data-act="rest" data-sec="180" data-l="Repos entre exercices">Lancer</button></div>`;
  });
  h+=`<h2>Renfo</h2>`;
  RENFO.forEach((e,i)=>{
    h+=`<div class="ex p-${k}"><div class="exhead"><div class="grow"><h3>${e.name}</h3>
      <div class="meta"><span><b>${e.sets}</b> séries</span><span><b>${e.reps}</b></span><span>Récup <b>${restTxt(e.rest)}</b></span></div></div>
      ${fig(FIG_BY_NAME[e.name],e.name)}</div>${setDots(base+'-r'+i,e.sets)}</div>`;
  });
  const d=S.done[base];
  h+=`<div style="margin-top:20px"><button class="btn full ${d?'':'primary'}" data-act="finish" data-s="${k}">${d?'Marquer comme non faite':'Terminer la séance'}</button></div>
  <p class="small muted" style="text-align:center">Touche une série quand elle est faite : la récup se lance toute seule.</p>`;
  return h;
}

function renderWod(){
  const w=S.week, base='w'+w+'-W', d=S.done[base];
  const hist=S.wod.slice().reverse().slice(0,5);
  return `<button class="back" data-act="home">‹ Cycle 1</button>
  <header class="top"><div><h1>WOD</h1><p>Semaine ${w} · AMRAP 20 minutes</p></div></header>
  <div class="ex" style="--pc:var(--line)"><div class="exhead"><div class="grow"><h3>Échauffement</h3><div class="meta"><span>Rameur <b>5 min</b></span><span>puis <b>3 min</b> de repos</span></div></div>${fig('rameur','Rameur')}</div></div>
  <div class="ex p-W">
    <h3>Le maximum de tours en 20 min</h3>
    <div class="wodfigs">${[['pompes','7 pompes'],['squatjump','10 squats jump'],['swing','15 kettlebell swings russes (15 kg)']].map(([f,t])=>`<div>${fig(f,t)}${t}</div>`).join('')}</div>
    <div class="big-clock" id="amrapClock">${fmt(A.remain)}</div>
    <div style="display:flex;gap:10px;margin-top:10px">
      <button class="btn full primary" data-act="amrap-toggle">${A.running?'Pause':(A.remain<A.dur&&A.remain>0?'Reprendre':'Démarrer')}</button>
      <button class="btn" data-act="amrap-reset">Réinitialiser</button>
    </div>
    <div class="rounds">
      <button class="circle-btn" data-act="round-minus" aria-label="Retirer un tour">−</button>
      <div><div class="n">${A.rounds}</div><div class="small muted" style="text-align:center">tours</div></div>
      <button class="circle-btn plus" data-act="round-plus" aria-label="Ajouter un tour">+</button>
    </div>
    <button class="btn full" data-act="wod-save">Enregistrer mon score et terminer</button>
  </div>
  <div class="note">Termine par des étirements.</div>
  ${d?`<button class="btn full" data-act="finish" data-s="W">Marquer comme non faite</button>`:''}
  ${hist.length?`<h2>Derniers scores</h2><div class="list">${hist.map(x=>`<div class="row"><span class="grow">${esc(x.date)} · semaine ${x.week}</span><b>${x.rounds} tours</b></div>`).join('')}</div>`:''}`;
}

function renderTests(){
  const day = view.sub ?? 0, t=TESTS[day];
  let h=`<header class="top"><div><h1>Tests 1RM</h1><p>À faire avant le cycle pour connaître ton maximum</p></div></header>
  <div class="weeks" role="group" aria-label="Jour">${TESTS.map((x,i)=>`<button data-act="day" data-d="${i}" aria-pressed="${i===day}">${x.day}</button>`).join('')}</div>
  <div class="ex" style="--pc:var(--line)"><div class="exhead"><div class="grow"><h3>Échauffement général</h3><div class="meta"><span>Rameur <b>5 min</b></span></div></div>${fig('rameur','Rameur')}</div></div>`;
  t.ex.forEach((e,ei)=>{
    const L=LIFTS.find(x=>x.id===e.lift);
    h+=`<div class="ex" style="--pc:var(--t)">
      <div class="exhead"><div class="grow"><h3>${L.name}</h3><div class="small muted" style="margin-top:2px">${e.goal}</div></div>${fig(LIFT_FIG[e.lift],L.name)}</div>
      <div class="note" style="margin:10px 0 4px">Échauffement : ${e.warm}</div>`;
    e.steps.forEach((st,si)=>{
      const k='d'+day+'-'+e.lift+'-'+si, on=S.tests[k];
      h+=`<div class="step"><button class="check${on?' on':''}" data-act="tstep" data-k="${k}" data-sec="${st[2]}" aria-label="Palier ${si+1}${on?' fait':''}">✓</button>
        <div class="grow"><div class="reps">${st[0]}</div><div class="small muted">${st[1]}</div>
        <div class="small" style="margin-top:4px">Récup ${restTxt(st[2])}</div></div></div>`;
    });
    h+=`<details><summary><img class="coach-av" src="${COACH_IMG}" alt="">Conseils de Jim</summary><p>${e.note}</p></details>
      <div class="result"><input type="number" inputmode="decimal" step="0.5" min="0" placeholder="Ton résultat" value="${S.rm[e.lift]??''}" data-rm="${e.lift}" aria-label="Résultat ${L.name}"><span class="muted">${L.unit}</span>
      <button class="btn primary" data-act="saverm" data-l="${e.lift}">Enregistrer</button></div>
    </div>`;
    if(ei===0) h+=`<div class="restline"><span class="grow">Prends 3 à 5 min pour récupérer avant l’exercice suivant</span><button class="btn sm" data-act="rest" data-sec="240" data-l="Repos avant le prochain test">Lancer</button></div>`;
  });
  return h;
}

function renderRecords(){
  return `<header class="top"><div><h1>Records</h1><p>Tes 1RM servent à calculer les charges du cycle</p></div></header>
  <h2>Mes 1RM</h2>
  <div class="list">${LIFTS.map(L=>`<div class="rec"><label for="r-${L.id}">${L.name}${S.rmDate[L.id]?`<br><span class="small muted" style="font-weight:400">${esc(S.rmDate[L.id])}</span>`:''}</label>
    <input id="r-${L.id}" type="number" inputmode="decimal" step="0.5" min="0" value="${S.rm[L.id]??''}" data-rec="${L.id}" placeholder="–"><span>${L.unit}</span></div>`).join('')}</div>
  <h2>Charges du cycle (50 %)</h2>
  <div class="list">${['squat','sdt','haute','horiz'].map(l=>{const L=LIFTS.find(x=>x.id===l), v=half(l);
    return `<div class="row"><span class="grow">${L.name}</span><b>${v?v+' kg':'–'}</b></div>`;}).join('')}</div>
  ${S.wod.length?`<h2>Scores WOD</h2><div class="list">${S.wod.slice().reverse().map(x=>`<div class="row"><span class="grow">${esc(x.date)} · semaine ${x.week}</span><b>${x.rounds} tours</b></div>`).join('')}</div>`:''}
  <h2>Réglages</h2>
  <div class="list">
    <button class="row" data-act="reset-week"><span class="grow">Remettre à zéro la semaine ${S.week}</span></button>
    <button class="row btn danger" style="justify-content:flex-start;border-radius:0;background:none" data-act="reset-all"><span class="grow">Tout effacer</span></button>
  </div>
  <p class="small muted" style="text-align:center;margin-top:18px">Tes données restent sur ce téléphone.</p>`;
}

function render(){
  let h='';
  if(view.tab==='cycle') h = view.sub ? renderSession(view.sub) : renderCycle();
  else if(view.tab==='tests') h = renderTests();
  else h = renderRecords();
  $('#app').innerHTML=h;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current', b.dataset.tab===view.tab?'page':'false'));
}

/* ---------- Interactions ---------- */
document.addEventListener('click',(ev)=>{
  const tabBtn=ev.target.closest('[data-tab]');
  if(tabBtn){ view={tab:tabBtn.dataset.tab, sub:null}; render(); window.scrollTo(0,0); return; }
  const b=ev.target.closest('[data-act]'); if(!b) return;
  unlockAudio();
  const a=b.dataset.act;
  switch(a){
    case 'week': S.week=+b.dataset.w; save(); render(); break;
    case 'day': view.sub=+b.dataset.d; render(); window.scrollTo(0,0); break;
    case 'open': view.sub=b.dataset.s; render(); window.scrollTo(0,0); break;
    case 'home': view.sub=null; render(); window.scrollTo(0,0); break;
    case 'set': {
      const k=b.dataset.k, i=+b.dataset.i; const arr=S.sets[k]||[]; arr[i]=!arr[i]; S.sets[k]=arr; save();
      b.classList.toggle('on',arr[i]);
      if(arr[i]){
        const [w,s,m]=k.split('-'); const idx=+m.slice(1);
        const ex = m[0]==='m' ? SESSIONS[s].main[idx] : RENFO[idx];
        const n=ex.sets, all=arr.filter(Boolean).length;
        if(all<n) startRest(ex.rest, ex.name+' · série '+(all+1)+' ensuite');
        else { stopRest(); toast(ex.name+' terminé'); }
      }
      break; }
    case 'tstep': {
      const k=b.dataset.k; S.tests[k]=!S.tests[k]; save(); b.classList.toggle('on',S.tests[k]);
      if(S.tests[k]) startRest(+b.dataset.sec,'Récupération');
      break; }
    case 'rest': startRest(+b.dataset.sec, b.dataset.l); break;
    case 'rest-plus': R.end+=15000; R.total+=15; if($('#sheet').classList.contains('finished')){ $('#sheet').classList.remove('finished'); clearInterval(R.int); R.end=Date.now()+15000; R.int=setInterval(tickRest,250);} tickRest(); break;
    case 'rest-minus': R.end-=15000; tickRest(); break;
    case 'rest-stop': stopRest(); break;
    case 'finish': {
      const key='w'+S.week+'-'+b.dataset.s; S.done[key]=!S.done[key]; save();
      if(S.done[key]){ stopRest(); toast('Séance terminée, bravo !'); view.sub=null; window.scrollTo(0,0); }
      render(); break; }
    case 'saverm': {
      const l=b.dataset.l, inp=document.querySelector(`[data-rm="${l}"]`), v=parseFloat(inp.value);
      if(isNaN(v)||v<=0){ toast('Entre un nombre valide'); inp.focus(); break; }
      S.rm[l]=v; S.rmDate[l]=new Date().toLocaleDateString('fr-FR'); save(); toast('Record enregistré'); break; }
    case 'amrap-toggle':
      if(A.running){ A.running=false; clearInterval(A.int); A.remain=(A.end-Date.now())/1000; }
      else { if(A.remain<=0) A.remain=A.dur; A.end=Date.now()+A.remain*1000; A.running=true; clearInterval(A.int); A.int=setInterval(amrapTick,250); beep(1); }
      render(); break;
    case 'amrap-reset': A.running=false; clearInterval(A.int); A.remain=A.dur; A.rounds=0; render(); break;
    case 'round-plus': A.rounds++; render(); break;
    case 'round-minus': A.rounds=Math.max(0,A.rounds-1); render(); break;
    case 'wod-save':
      S.wod.push({date:new Date().toLocaleDateString('fr-FR'), week:S.week, rounds:A.rounds});
      S.done['w'+S.week+'-W']=true; save();
      A.running=false; clearInterval(A.int); A.remain=A.dur; A.rounds=0;
      toast('Score enregistré'); view.sub=null; render(); window.scrollTo(0,0); break;
    case 'reset-week':
      if(confirm('Remettre à zéro la semaine '+S.week+' ?')){
        const p='w'+S.week+'-'; Object.keys(S.sets).forEach(k=>{if(k.startsWith(p)) delete S.sets[k];});
        Object.keys(S.done).forEach(k=>{if(k.startsWith(p)) delete S.done[k];}); save(); render(); toast('Semaine remise à zéro'); }
      break;
    case 'reset-all':
      if(confirm('Effacer toutes tes données (records, séances, scores) ?')){ S=fresh(); save(); render(); toast('Données effacées'); }
      break;
  }
});

document.addEventListener('change',(ev)=>{
  const id=ev.target.dataset.rec; if(!id) return;
  const v=parseFloat(ev.target.value);
  if(isNaN(v)||v<=0){ delete S.rm[id]; delete S.rmDate[id]; }
  else { S.rm[id]=v; S.rmDate[id]=new Date().toLocaleDateString('fr-FR'); }
  save(); render();
});

document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ if($('#sheet').classList.contains('open')) tickRest(); amrapTick(); } });

render();
requestAnimationFrame(animateFigs);
</script>
</body>
